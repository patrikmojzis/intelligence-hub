name: Deploy Intelligence Hub

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        env:
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_REGISTRY: ${{ vars.DIGITALOCEAN_REGISTRY }}
          MB_DB_CONNECTION_URI: ${{ secrets.MB_DB_CONNECTION_URI }}
          MB_DB_PASS: ${{ secrets.MB_DB_PASS }}
          MB_DB_USER: ${{ secrets.MB_DB_USER }}
          MB_ENCRYPTION_SECRET_KEY: ${{ secrets.MB_ENCRYPTION_SECRET_KEY }}
        run: |
          missing=0
          required=(
            APP_DOMAIN_NAME
            DIGITALOCEAN_ACCESS_TOKEN
            DIGITALOCEAN_REGISTRY
            MB_DB_CONNECTION_URI
            MB_DB_PASS
            MB_DB_USER
            MB_ENCRYPTION_SECRET_KEY
          )

          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing production variable or secret: ${variable}"
              missing=1
            fi
          done

          exit "$missing"

      - name: Free runner disk space
        uses: ./.github/actions/maximize-disk-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 7200

      - name: Build and push the production image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/${{ vars.DIGITALOCEAN_REGISTRY }}/intelligence-hub:${{ github.sha }}
          build-args: |
            MB_EDITION=ee
            VERSION=v1.0.0-intelligence-hub-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy the immutable image
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          APP_DOMAIN_NAME: ${{ vars.APP_DOMAIN_NAME }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          MB_DB_CONNECTION_URI: ${{ secrets.MB_DB_CONNECTION_URI }}
          MB_DB_PASS: ${{ secrets.MB_DB_PASS }}
          MB_DB_USER: ${{ secrets.MB_DB_USER }}
          MB_ENCRYPTION_SECRET_KEY: ${{ secrets.MB_ENCRYPTION_SECRET_KEY }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          print_build_logs: true
          print_deploy_logs: true
